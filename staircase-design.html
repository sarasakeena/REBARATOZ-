<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>REBARATOZ — Staircase Design Workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #0f172a;
      --bg-panel: #1e293b;
      --bg-input: #0b1120;
      
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #22c55e;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --border: #334155;
      
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-glow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── Top Navbar ─── */
    .navbar {
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background-color: var(--bg-panel);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand svg {
      width: 24px;
      height: 24px;
      fill: var(--accent);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-profile {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: white;
      cursor: pointer;
      border: 2px solid var(--bg-panel);
      box-shadow: 0 0 0 1px var(--border);
      transition: transform 0.2s;
    }

    .user-profile:hover {
      transform: scale(1.05);
    }

    /* ─── Workspace Layout ─── */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 64px);
    }

    /* ─── Sidebar / Controls ─── */
    .sidebar {
      width: 320px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header h2 svg {
      fill: var(--accent);
    }

    .control-group {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .control-group h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 16px;
      font-weight: 600;
    }

    .input-field {
      margin-bottom: 16px;
    }

    .input-field:last-child {
      margin-bottom: 0;
    }

    .input-field label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-field input, .input-field select {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .input-field input:focus, .input-field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .action-panel {
      padding: 20px;
      margin-top: auto;
    }

    .btn-generate {
      width: 100%;
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-glow);
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }

    .btn-generate:active {
      transform: translateY(0);
    }

    /* ─── Canvas Area ─── */
    .canvas-area {
      flex: 1;
      background-color: var(--bg-base);
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .canvas-toolbar {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(8px);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .tool-btn.active {
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }

    .canvas-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .blueprint-mockup {
      width: 70%;
      max-width: 800px;
      aspect-ratio: 16/9;
      background-color: rgba(30, 41, 59, 0.5);
      border: 1px dashed var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    .blueprint-mockup::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(56, 189, 248, 0.05) 50%, transparent 60%);
      background-size: 200% 200%;
      animation: shine 4s infinite linear;
    }

    @keyframes shine {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .blueprint-mockup svg {
      width: 64px;
      height: 64px;
      fill: var(--border);
      margin-bottom: 16px;
      transition: fill 0.3s ease;
    }

    .blueprint-mockup:hover svg {
      fill: var(--accent);
    }

    .status-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: var(--success);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.4);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .status-toast.show {
      transform: translateY(0);
      opacity: 1;
    }

  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13h-13L12 6.5z"/></svg>
      REBARATOZ
    </div>
    <div class="nav-actions">
      <a href="dashboard.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px; margin-right: 16px; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">← Back to Dashboard</a>
      <div class="user-profile" title="My Account">U</div>
    </div>
  </nav>

  <!-- Workspace -->
  <div class="workspace">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v-2H4v4h4v-2h2v5h2v-5h2v2h2v-4h-4v2z"/></svg>
          Staircase Detailing
        </h2>
      </div>

      <div class="control-group">
        <h3>Geometry</h3>
        <div class="input-field">
          <label>Staircase Type</label>
          <select>
            <option>Straight Flight</option>
            <option>Dog-legged (U-Shape)</option>
            <option>Open Well</option>
          </select>
        </div>
        <div class="input-field">
          <label>Tread Width (mm)</label>
          <input type="number" value="300" />
        </div>
        <div class="input-field">
          <label>Riser Height (mm)</label>
          <input type="number" value="150" />
        </div>
        <div class="input-field">
          <label>Waist Slab Thickness (mm)</label>
          <input type="number" value="175" />
        </div>
      </div>

      <div class="control-group">
        <h3>Reinforcement</h3>
        <div class="input-field">
          <label>Main Bar Diameter (mm)</label>
          <select>
            <option>10</option>
            <option selected>12</option>
            <option>16</option>
          </select>
        </div>
        <div class="input-field">
          <label>Distribution Bar (mm)</label>
          <select>
            <option selected>8</option>
            <option>10</option>
          </select>
        </div>
      </div>

      <div class="action-panel">
        <button class="btn-generate" onclick="generateDrawing()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
          Generate Drawing
        </button>
      </div>
    </aside>

    <!-- Canvas -->
    <main class="canvas-area">
      <div class="canvas-toolbar">
        <button class="tool-btn active" title="Select"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2l12 11.2-5.8.5 3.3 7.3-2.2.9-3.2-7.4-4.4 4.7z"/></svg></button>
        <button class="tool-btn" title="Pan"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23 11.5c0 1.3-1.1 2.3-2.4 2.3h-4v4c0 1.3-1 2.3-2.3 2.3s-2.3-1-2.3-2.3v-4h-1v4c0 1.3-1 2.3-2.3 2.3S6.4 19.1 6.4 17.8v-4h-4c-1.3 0-2.3-1-2.3-2.3S1.1 9.2 2.4 9.2h4v-4C6.4 3.9 7.4 2.9 8.7 2.9s2.3 1 2.3 2.3v4h1v-4c0-1.3 1-2.3 2.3-2.3S16.6 3.9 16.6 5.2v4h4c1.3 0 2.4 1 2.4 2.3z"/></svg></button>
        <button class="tool-btn" title="Zoom In"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm.5-7H9v2H7v1h2v2h1v-2h2V9h-2V7z"/></svg></button>
        <button class="tool-btn" title="Export DXF"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>
      </div>

      <div class="canvas-center">
        <div class="blueprint-mockup" id="blueprint-mockup">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
          <div style="font-size: 16px; font-weight: 500;">Canvas Empty</div>
          <div style="font-size: 13px; margin-top: 8px;">Adjust parameters and click Generate Drawing</div>
        </div>
      </div>
    </main>

  </div>

  <div class="status-toast" id="toast">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
    Drawing generated successfully!
  </div>

  <script>
    function generateDrawing() {
      const btn = document.querySelector('.btn-generate');
      const mockup = document.getElementById('blueprint-mockup');
      const toast = document.getElementById('toast');
      
      // Simulate loading
      btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 2v4c4.41 0 8 3.59 8 8s-3.59 8-8 8-8-3.59-8-8H2c0 5.52 4.48 10 10 10s10-4.48 10-10S17.52 2 12 2z"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/></path></svg> Generating...`;
      btn.style.opacity = '0.8';
      btn.style.pointerEvents = 'none';
      
      setTimeout(() => {
        // Reset button
        btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg> Generate Drawing`;
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
        
        // Show fake drawing
        mockup.innerHTML = `
          <div style="position: absolute; inset: 20px; border: 2px solid var(--accent); border-radius: 4px; display: flex; flex-direction: column;">
            <!-- Dummy blueprint lines -->
            <div style="flex: 1; border-bottom: 2px solid #334155; position: relative;">
               <div style="position: absolute; bottom: 0; left: 10%; width: 20%; height: 40px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent);"></div>
               <div style="position: absolute; bottom: 40px; left: 30%; width: 20%; height: 40px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent);"></div>
               <div style="position: absolute; bottom: 80px; left: 50%; width: 20%; height: 40px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent);"></div>
               <div style="position: absolute; top: 10px; right: 10px; color: var(--accent); font-family: monospace; font-size: 12px;">SECTION A-A</div>
            </div>
            <div style="height: 40%; padding: 10px; color: var(--text-muted); font-family: monospace; font-size: 11px; display: flex; flex-direction: column; gap: 4px;">
               <span style="color:var(--accent);">MAIN BAR: 12mm @ 150c/c</span>
               <span>DIST BAR: 8mm @ 200c/c</span>
               <span>WAIST SLAB: 175mm</span>
               <span>CONCRETE: M25, STEEL: Fe500D</span>
            </div>
          </div>
        `;
        mockup.style.background = 'rgba(15, 23, 42, 0.8)';
        
        // Show toast
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      }, 1500);
    }
  </script>
</body>
</html>
